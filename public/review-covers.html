<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Revisión de Fotos Frontales - RG Motors</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    h1 { color: #f59e0b; margin-bottom: 24px; }
    .vehicle-card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 24px; border: 1px solid #334155; }
    .vehicle-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .vehicle-title { font-size: 18px; font-weight: bold; }
    .plate-badge { background: #e11d48; color: white; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-family: monospace; }
    .photo-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
    .photo-item { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid transparent; background: #020617; flex: 0 0 160px; text-align: center; }
    .photo-item.is-cover { border-color: #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.4); }
    .photo-item img { width: 160px; height: 120px; object-fit: cover; display: block; }
    .photo-label { padding: 4px; font-size: 12px; font-weight: bold; background: #0f172a; color: #cbd5e1; }
    .badge-cover { position: absolute; top: 4px; left: 4px; background: #22c55e; color: black; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Catálogo RG Motors: Fotos de Cada Vehículo</h1>
  <div id="container">Cargando...</div>

  <script>
    async function load() {
      const res = await fetch('/api/vehicles');
      const vehicles = await res.json();
      const withPhotos = vehicles.filter(v => v.hasRealPhotos);

      const container = document.getElementById('container');
      container.innerHTML = '';

      withPhotos.forEach((v, idx) => {
        const card = document.createElement('div');
        card.className = 'vehicle-card';
        card.id = 'vehicle-' + idx;

        const header = document.createElement('div');
        header.className = 'vehicle-header';
        header.innerHTML = `
          <div class="vehicle-title">${idx + 1}. ${v.brand} ${v.model} (${v.year})</div>
          <div class="plate-badge">${v.plate}</div>
        `;
        card.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'photo-grid';

        const gallery = v.gallery && v.gallery.length ? v.gallery : [v.image];
        gallery.forEach(imgUrl => {
          const item = document.createElement('div');
          const isCover = imgUrl === v.image;
          item.className = 'photo-item' + (isCover ? ' is-cover' : '');

          const filename = imgUrl.split('/').pop();
          item.innerHTML = `
            ${isCover ? '<div class="badge-cover">ACTUAL</div>' : ''}
            <img src="${imgUrl}" loading="eager" />
            <div class="photo-label">${filename}</div>
          `;
          grid.appendChild(item);
        });

        card.appendChild(grid);
        container.appendChild(card);
      });
    }
    load();
  </script>
</body>
</html>
