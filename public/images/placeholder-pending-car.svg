<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.15">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800" stroke="#38bdf8" stroke-width="1"/>
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600" stroke="#38bdf8" stroke-width="1"/>
  </g>
  
  <!-- Silhouette of Car -->
  <g transform="translate(250, 180)" fill="none" stroke="#334155" stroke-width="3" opacity="0.6">
    <path d="M20 140 C40 100, 70 60, 110 50 L180 50 C230 50, 260 90, 280 140 L300 140 C310 140, 315 150, 315 160 L315 180 L290 180 C290 160, 270 160, 270 180 L80 180 C80 160, 60 160, 60 180 L10 180 C5 180, 0 175, 0 165 L0 150 C0 140, 10 140, 20 140 Z"/>
    <circle cx="70" cy="180" r="18" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <circle cx="280" cy="180" r="18" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  </g>
  
  <!-- Camera Icon -->
  <g transform="translate(370, 210)" fill="none" stroke="url(#accent)" stroke-width="2.5">
    <rect x="0" y="10" width="60" height="42" rx="6" fill="#1e293b"/>
    <path d="M18 10 L24 2 L36 2 L42 10 Z" fill="#1e293b"/>
    <circle cx="30" cy="31" r="12"/>
    <circle cx="48" cy="20" r="2.5" fill="#38bdf8"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    FOTOGRAFÍAS EN PREPARACIÓN
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#94a3b8" text-anchor="middle">
    Unidad física en stock · Sesión fotográfica en patio de Puerto Montt
  </text>
  
  <!-- Badge -->
  <rect x="310" y="420" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="443" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">
    RG MOTORS
  </text>
</svg>
